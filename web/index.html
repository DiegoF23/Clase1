<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase ej</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <header>
        <h1>Gestion de Productos</h1>
    </header>
    <main class="contenedor">
        <section class="panel-listado" >
            <div class="barra-superior">
                <h2>Productos cargados</h2>
                <button id="btn-nuevo">Agregar nuevo producto</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-productos">
                    <!--js insertara las filas -->
                </tbody>
            </table>
        </section>

        <section id="panel-formulario" class="panel-formulario oculto">
            <h2 id="titulo-formulario"> Agregar Producto </h2>
            <form id ="form-product">
                <input type="hidden" id="producto-id">
                <div class="campo">
                    <label for="nombre">Producto</label>
                    <input type="text" id="nombre" placeholder="Ingrese nombre">
                </div>
                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" placeholder="Ingrese precio">
                </div>
                <div class="acciones-formulario">
                    <button type="submit">Guardar</button>
                    <button type="button" id="btn-cancelar">Cancelar </button>
                </div>
            </form>

        </section>


    </main>



    <footer>Clase 1</footer>

    <script src="app.js"></script>

</body>
</html>
